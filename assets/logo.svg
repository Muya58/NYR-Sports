    <path d="M28 74 C50 66 76 66 96 72" stroke="url(#lg-lime)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <text x="60" y="64" text-anchor="middle" font-family="-apple-system,'SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="800" letter-spacing="-1" fill="#fff">NYR</text>
