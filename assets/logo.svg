<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="NYR Sports">
  <defs>
    <linearGradient id="lg-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3A66"/>
      <stop offset=".55" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#050E1D"/>
    </linearGradient>
    <linearGradient id="lg-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lg-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#C6F432" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="lg-lime" x1="0" y1="0" x2="1" y2="0">
